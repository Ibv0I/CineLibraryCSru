name: Build CineLibrary RU

on:
  push:
    branches:
      - ru
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild CineLibraryCS.csproj -t:Restore -p:Platform=x64

      - name: Build
        run: msbuild CineLibraryCS.csproj -t:Build -p:Configuration=Release -p:Platform=x64

      - name: Publish
        run: msbuild CineLibraryCS.csproj -t:Publish -p:Configuration=Release -p:Platform=x64 -p:PublishDir=publish\

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: CineLibrary-RU
          path: publish
